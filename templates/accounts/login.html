{% extends "base.html" %}
{% block title %}Вход — ManyTracker{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post">
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="errors">{{ form.non_field_errors }}</div>
  {% endif %}
  {% for field in form %}
    <label>{{ field.label }}</label>
    {{ field }}
  {% endfor %}
  <button type="submit">Войти</button>
</form>
{% endblock %}
