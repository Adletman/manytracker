{% extends "base.html" %}
{% block content %}
<h1>Удалить трату?</h1>
<p>{{ expense.date }} — {{ expense.category_display }} — {{ expense.amount }} ₸</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Да, удалить</button>
  <a href="{% url 'expense_detail' expense.id %}">Отмена</a>
</form>
{% endblock %}
